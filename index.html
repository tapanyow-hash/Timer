<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวจับเวลาพร้อมคำนวณอัตราส่วน PWA</title>
    <!-- 1. ลิงก์ PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light background */
        }
        /* Custom styles for button size and shape */
        .btn {
            /* กำหนดความสูงและความกว้างตามที่ผู้ใช้ต้องการ: 50px สูง, 100px กว้าง */
            height: 50px; 
            width: 100px; 
            /* กำหนด border-radius: 25vh เพื่อให้เกิดความมนโค้ง */
            border-radius: 25vh; 
            
            /* ใช้ Flex เพื่อจัดข้อความกลางปุ่ม */
            @apply text-base shadow-lg transition duration-200 ease-in-out uppercase flex items-center justify-center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Styles for the main container to ensure responsiveness */
        .main-container {
            min-height: 100vh;
        }
        /* Styles for the input element to ensure large text */
        #inputNumber {
            font-size: 2.25rem; /* text-4xl equivalent */
        }
        /* Styles for the result display to ensure large text */
        #calculationResult {
            font-size: 4rem; /* text-6xl equivalent */
        }
        /* Fullscreen button styling */
        #fullscreenButton {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: background-color 0.2s;
        }
        #fullscreenButton:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }
    </style>
    <!-- ตั้งค่า Tailwind Configuration เพื่อใช้สีที่กำหนดเอง -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-green': '#4CAF50',
                        'custom-red': '#F44336',
                        'custom-purple': '#9C27B0',
                    }
                }
            }
        }
    </script>
</head>
<body>

<div id="app" class="main-container p-4 flex items-start justify-center pt-10 md:pt-16">
    <!-- กรอบหลัก (Main Frame) - เพิ่มคลาส relative เพื่อให้ปุ่ม Fullscreen วางตำแหน่ง absolute ได้ -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col items-center relative">

        <!-- 1. ช่องใส่ตัวเลข (Input) -->
        <label for="inputNumber" class="text-sm font-semibold text-gray-600 mb-2">จำนวนคนทั้งหมด</label>
        <input type="number" id="inputNumber" value="1000"
               class="font-extrabold text-center text-gray-800 p-4 w-full max-w-xs border-4 border-gray-300 rounded-xl focus:border-blue-500 focus:ring-blue-500 transition duration-150 mb-6"
               min="0">

        <!-- 2. ปุ่มควบคุม (Buttons Container: จัดเรียงแนวนอน) -->
        <div class="w-full flex justify-center space-x-4 mb-6">
            <button id="startButton" class="btn bg-custom-green text-white hover:bg-green-700">
                START
            </button>
            <button id="stopButton" class="btn bg-custom-red text-white hover:bg-red-700" disabled>
                STOP
            </button>
            <button id="resetButton" class="btn bg-custom-purple text-white hover:bg-purple-700">
                RESET
            </button>
        </div>

        <!-- เส้นแบ่ง -->
        <div class="w-full h-px bg-gray-200 my-6"></div>

        <!-- 3. ผลลัพธ์จากการคำนวณ (อัตราส่วน) -->
        <div id="resultDisplay" class="flex flex-col items-center justify-center text-center mb-8">
            <p class="text-base text-gray-600 font-medium mb-2">จำนวนคน/นาที</p> 
            <p id="calculationResult" class="font-black text-gray-900 leading-none">
                <!-- ผลลัพธ์หลัก (ปัดเศษปกติ) -->
                <!-- สัญลักษณ์ Infinity (SVG) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-red-500 mx-auto" viewBox="0 0 200 100">
                    <path fill="currentColor" d="M100 50c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25zm50 25c0-13.8 11.2-25 25-25s25 11.2 25 25-11.2 25-25 25-25-11.2-25-25zm-100 0c0-13.8 11.2-25 25-25s25 11.2 25 25-11.2 25-25 25-25-11.2-25-25z" transform="scale(0.8) translate(20, -5)" /></svg>
            </p>
            <!-- ผลลัพธ์รอง (ทศนิยม 2 ตำแหน่ง) -->
            <p id="decimalResult" class="text-sm text-gray-500 font-light mt-1">0.00</p>
        </div>

        <!-- 4. แสดงเวลาที่ใช้ -->
        <div class="text-center">
            <p class="text-base text-gray-600 font-medium mb-1">เวลาที่ใช้</p>
            <p id="timeDisplay" class="text-2xl font-extrabold text-gray-800">
                0 นาที 0 วินาที
            </p>
        </div>
        
        <!-- ปุ่ม Fullscreen (มุมขวาล่างของ Frame) -->
        <button id="fullscreenButton" class="absolute bottom-2 right-2 bg-gray-100 hover:bg-gray-200 rounded-lg p-1.5 transition duration-150">
            <!-- Icon SVG for Fullscreen (Expand) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>

    </div>
</div>


<script>
    // ----------------------------------------------------------------
    // ส่วนของ JavaScript Logic
    // ----------------------------------------------------------------
    
    // ตัวแปรสถานะ
    let timerInterval = null; 
    let startTime = 0;       
    let elapsedTime = 0;     
    let isRunning = false;   
    
    // การเข้าถึง Elements
    const inputEl = document.getElementById('inputNumber');
    const startBtn = document.getElementById('startButton');
    const stopBtn = document.getElementById('stopButton');
    const resetBtn = document.getElementById('resetButton');
    const resultEl = document.getElementById('calculationResult');
    const decimalEl = document.getElementById('decimalResult');
    const timeEl = document.getElementById('timeDisplay');
    const fullscreenBtn = document.getElementById('fullscreenButton'); 

    // โค้ด SVG ของสัญลักษณ์ Infinity
    const infinitySVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-red-500 mx-auto" viewBox="0 0 200 100"><path fill="currentColor" d="M100 50c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25zm50 25c0-13.8 11.2-25 25-25s25 11.2 25 25-11.2 25-25 25-25-11.2-25-25zm-100 0c0-13.8 11.2-25 25-25s25 11.2 25 25-11.2 25-25 25-25-11.2-25-25z" transform="scale(0.8) translate(20, -5)" /></svg>`;

    /**
     * อัปเดตการแสดงผล (เวลาและผลลัพธ์การคำนวณ)
     */
    function updateDisplay() {
        // 1. คำนวณเวลาที่แสดงผล (นาทีและวินาที)
        const totalSeconds = Math.floor(elapsedTime / 1000);
        const minutesDisplay = Math.floor(totalSeconds / 60);
        const secondsDisplay = totalSeconds % 60;
        
        // อัปเดตเวลาที่จับได้
        timeEl.textContent = `${minutesDisplay} นาที ${secondsDisplay} วินาที`;

        // 2. คำนวณอัตราส่วน (ใช้หน่วยเป็นนาทีและปัดเศษแบบปกติ)
        const inputNum = parseFloat(inputEl.value) || 0;
        const totalMinutes = elapsedTime / 60000; // 60,000 มิลลิวินาที = 1 นาที
        
        if (elapsedTime < 100) { 
            // กรณีที่เวลายังไม่เริ่ม (หรือเวลาเกือบเป็น 0)
            resultEl.innerHTML = infinitySVG;
            decimalEl.textContent = "0.00"; 
        } else {
            // คำนวณอัตราส่วนจริง
            const rawResult = inputNum / totalMinutes;

            // ผลลัพธ์หลัก: ปัดเศษแบบปกติ (จำนวนเต็ม)
            const roundedResult = Math.round(rawResult);
            resultEl.textContent = roundedResult.toString();
            resultEl.classList.add('text-gray-900');
            resultEl.classList.remove('text-red-500');

            // ผลลัพธ์รอง: ทศนิยม 2 ตำแหน่ง
            const decimalResult = rawResult.toFixed(2);
            decimalEl.textContent = decimalResult;
        }
    }

    /**
     * เริ่มการจับเวลา
     */
    function startTimer() {
        if (isRunning) return;

        startTime = Date.now() - elapsedTime; 
        
        timerInterval = setInterval(() => {
            elapsedTime = Date.now() - startTime;
            updateDisplay();
        }, 100);

        isRunning = true;
        
        startBtn.disabled = true;
        stopBtn.disabled = false;
        inputEl.disabled = true;
    }

    /**
     * หยุดการจับเวลา
     */
    function stopTimer() {
        if (!isRunning) return;

        clearInterval(timerInterval);
        isRunning = false;
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        inputEl.disabled = false;
    }

    /**
     * รีเซ็ตการจับเวลา
     */
    function resetTimer() {
        stopTimer(); 
        
        elapsedTime = 0;
        updateDisplay(); 
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        inputEl.disabled = false;
    }

    /**
     * สลับโหมดเต็มหน้าจอ (Fullscreen)
     */
    function toggleFullscreen() {
        const mainApp = document.getElementById('app').querySelector('div'); // กรอบสีขาวหลัก
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            // ขอ Fullscreen จากกรอบสีขาวหลัก
            mainApp.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                // Fallback attempt on document body/documentElement
                document.documentElement.requestFullscreen().catch(err2 => {
                    console.error(`Error attempting to enable full-screen mode on document: ${err2.message}`);
                });
            });
        }
    }

    // ----------------------------------------------------------------
    // Event Listeners
    // ----------------------------------------------------------------
    
    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', resetTimer);
    fullscreenBtn.addEventListener('click', toggleFullscreen); 
    inputEl.addEventListener('input', updateDisplay);

    // ----------------------------------------------------------------
    // PWA Service Worker Registration
    // ----------------------------------------------------------------
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }


    // Initial setup
    window.onload = function() {
        updateDisplay(); 
    }

</script>

</body>
</html>
